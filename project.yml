name: Notepad
options:
  bundleIdPrefix: com.notepad
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_FILE: Notepad/Resources/Info.plist
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGNING_ALLOWED: false
    CODE_SIGNING_REQUIRED: false
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    UI_USER_INTERFACE_STYLE: Dark

targets:
  Notepad:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Notepad/Sources
      - path: Notepad/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notepad.app
        PRODUCT_NAME: Notepad
        DISPLAY_NAME: Notepad
        INFOPLIST_FILE: Notepad/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ""
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies: []

  NotepadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NotepadTests
    dependencies:
      - target: Notepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notepad.app.tests
        ENABLE_TESTING_SEARCH_PATHS: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ""
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Notepad:
    build:
      targets:
        Notepad: all
        NotepadTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotepadTests
    archive:
      config: Release
